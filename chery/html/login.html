<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASISTEC - Inicio de Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor-login">
        <div class="tarjeta-login">
            <div class="encabezado-login">
                <div class="contenedor-escudo-colegio">
                    <img src="{{ url_for('static', filename='escudo.png') }}" alt="Escudo Institución Educativa José Joaquín Flórez Hernández" class="escudo-colegio">
                </div>
                <h1>ASISTEC</h1>
                <p>Sistema Académico de Control de Asistencia</p>
            </div>

            {% if error %}
                <div class="alerta error">
                    <strong>Error:</strong> {{ error }}
                </div>
            {% endif %}

            {% if exito %}
                <div class="alerta exito" style="background-color: #ecfdf5; border-left: 4px solid #10b981; color: #065f46; padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem;">
                    <strong>Éxito:</strong> {{ exito }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" class="formulario-login">
                <div class="grupo-campo">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required autofocus placeholder="Ingresa tu usuario institucional">
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                </div>

                <button type="submit" class="btn-ingresar">Ingresar al Sistema</button>
                <a href="{{ url_for('crear_cuenta') }}" class="btn-crear-cuenta">Crear cuenta</a>
            </form>

            <div class="pistas-login">
                <strong>Credenciales de Prueba:</strong><br>
                👨‍🏫 Docente: <code>docente1</code> / <code>1234</code><br>
                👔 Coordinador: <code>coordinador</code> / <code>admin123</code>
            </div>
        </div>
    </div>
</body>
</html>
