<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASISTEC - Inicio de Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="cuerpo-login">
    <div class="tarjeta-login">
        <header class="encabezado-login">
            <h1 class="logo-asistec">ASISTEC</h1>
            <p class="subtitulo">Sistema Inteligente de Registro de Asistencia Estudiantil</p>
        </header>

        {% if error %}
            <div class="alerta error">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="formulario-login">
            <div class="campo-formulario">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingresa tu usuario" autocomplete="username">
            </div>

            <div class="campo-formulario">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primario">Iniciar sesión</button>
        </form>

        <footer class="pie-login">
            <p>ASISTEC &copy; 2026 - Control de Asistencia</p>
        </footer>
    </div>
</body>
</html>
